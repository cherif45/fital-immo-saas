    <!-- Nettoyage quotidien : localStorage uniquement, SANS toucher au Service Worker -->
    <script>
      (function() {
        try {
          var CACHE_DATE_KEY = 'fital_cache_clear_date';
          var today = new Date().toISOString().split('T')[0];
          var lastClear = localStorage.getItem(CACHE_DATE_KEY);
          
          if (lastClear !== today) {
            console.log('🧹 Nettoyage localStorage quotidien...');
            
            // ⚠️ On NE désenregistre PLUS le Service Worker (nécessaire pour la PWA)
            // On NE supprime PLUS les caches du SW (gérés par vite-plugin-pwa)
            
            // On nettoie uniquement le localStorage applicatif
            var keep = ['fital_immo_user', 'fital_immo_current_user', CACHE_DATE_KEY];
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('fital_immo_') === 0 && keep.indexOf(k) === -1) {
                toRemove.push(k);
              }
            }
            toRemove.forEach(function(k) { localStorage.removeItem(k); });
            localStorage.setItem(CACHE_DATE_KEY, today);
            
            console.log('✅ localStorage nettoyé (' + toRemove.length + ' clés supprimées)');
          }
        } catch (e) { console.log('Cache cleanup error:', e); }
      })();
    </script>
